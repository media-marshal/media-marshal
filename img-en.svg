  <path d="M1014 300 C1015 320, 1015 342, 1015 363" class="line" marker-end="url(#arrow)"/>
  <text x="930" y="338" class="text label">Yes: hard link</text>

  <path d="M1187 247 C1244 247, 1262 260, 1262 303 L1262 365" class="line"/>
  <text x="1244" y="329" class="text label">No: move file</text>
  <path d="M1262 365 C1262 401, 1227 416, 1157 416" class="line" marker-end="url(#arrow)"/>

  <rect x="910" y="378" width="244" height="84" rx="15" class="box"/>
