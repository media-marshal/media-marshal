  <text x="628" y="410" class="text">Media server</text>
  <text x="628" y="439" class="text small">Emby/Jellyfin/Plex</text>

  <path d="M1032 568 C1032 533, 1032 499, 1032 466" class="line dash" marker-end="url(#arrow)"/>
