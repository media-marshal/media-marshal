<svg xmlns="http://www.w3.org/2000/svg" width="1429" height="697" viewBox="0 0 1429 697">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#1d73d1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .line { stroke: #1d73d1; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .box { stroke: #1d73d1; fill: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 11 11; }
      .text {
        fill: #1d73d1;
        font-family: "Comic Sans MS", "Segoe Print", "Trebuchet MS", Arial, sans-serif;
        font-size: 22px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .small { font-size: 19px; }
      .label { font-size: 21px; }
    </style>
  </defs>

  <rect x="34" y="114" width="1358" height="376" rx="28" class="line dash"/>
