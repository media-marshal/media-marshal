  <rect x="526" y="210" width="218" height="72" rx="15" class="box"/>
  <text x="635" y="246" class="text">MediaMarshal</text>

  <path d="M751 247 C778 247, 803 247, 829 247" class="line" marker-end="url(#arrow)"/>

  <path d="M842 247 L1014 196 L1186 247 L1014 298 Z" class="box"/>
